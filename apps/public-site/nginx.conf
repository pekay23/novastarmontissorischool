# ============================================================================
# Novastar Montessori - public-site nginx vhost
#
# The site is a Next.js `output: 'export'` build with `trailingSlash: true`, so
# every route exists on disk as <route>/index.html. That means:
#   - `try_files $uri $uri/ =404` is the correct fallback. The usual SPA
#     `try_files ... /index.html` would answer 200 for every typo'd URL and
#     quietly serve the homepage instead of a 404.
#   - There is no server-side rendering, so a request only 404s if the path was
#     never generated at build time.
# ============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;

    # --- security headers ---------------------------------------------------
    # The portal sets its own full CSP in next.config.ts; this site is static
    # HTML with no inline scripts, so a strict policy is cheap here.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-DNS-Prefetch-Control "off" always;

    # --- healthcheck --------------------------------------------------------
    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "healthy\n";
    }

    # --- immutable build output --------------------------------------------
    # Everything under /_next/static/ is content-hashed by Next.
    location /_next/static/ {
        access_log off;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Fingerprinted public assets (fonts/, hashed images).
    location ~* ^/(fonts|images)/ {
        access_log off;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000" always;
        try_files $uri =404;
    }

    location ~* \.(?:ico|svg|png|jpg|jpeg|webp|avif|woff2?|ttf|eot)$ {
        access_log off;
        expires 7d;
        add_header Cache-Control "public, max-age=604800" always;
        try_files $uri =404;
    }

    # --- html ----------------------------------------------------------------
    # must-revalidate rather than immutable: these are plain index.html files
    # whose names do not change, so a long max-age would strand stale content.
    location / {
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
    error_page 500 502 503 504 /50x.html;

    location = /404.html {
        internal;
    }
    location = /50x.html {
        internal;
    }
}