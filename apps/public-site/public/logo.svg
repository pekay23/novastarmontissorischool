<!--
  Horizontal lockup: mark + wordmark + descriptor. The viewBox starts at y=14
  rather than 0 because the artwork's ink only spans y≈17..62 — the original
  0 0 340 80 box carried ~22 units of empty margin top and bottom. In the navbar
  this file renders at 40px tall, so that dead space was being paid for twice:
  the "MONTESSORI SCHOOL" line computed to 7px on screen and was illegible
  regardless of its colour. Cropping to the ink makes the wordmark ~22px and the
  descriptor ~10px at the same rendered height.

  THIS COMMENT IS WHY THE LOGO WAS INVISIBLE. It used to spell out CSS custom
  property names — color-primary, color-wine, color-background — and an XML
  comment may not contain a double hyphen anywhere inside it. The first one
  terminated the comment early, the rest became bogus markup, and Chromium
  refused to parse the document at all: the <img> decoded to nothing, rendered a
  227x36 box with no pixels in it, and no amount of CSS would have brought it
  back. Refer to tokens without their leading hyphens here, or write
  "the primary token". Do not spell one out in full anywhere in this file.

  Palette, matching app/globals.css as of this revision. The wordmark is the
  primary token (#5a1121) and the descriptor is the primary-dark token
  (#772836); both were previously royal amethyst #5F1989, which the design system
  demotes to leadership-spotlight accents. The descriptor used to be the literal
  #772D42, which matched no token at all — a magic value that drifted silently,
  now aligned with the token it was standing in for.

  Measured against the background token (#faf8f5), which is what the sticky header
  resolves to at 95% opacity over the page:
    #5a1121 wordmark   12.89:1
    #772836 descriptor  9.25:1
    #b94c25 mark edge  4.80:1  (a graphic, so the 3:1 floor of 1.4.11 applies)
  Recompute rather than trusting these; tools/ui-audit/tokens.mjs exists for it.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 14 340 54" width="340" height="54">
  <circle cx="28" cy="40" r="18" fill="#5a1121"/>
  <path d="M28 18 L14 40 L42 40 Z" fill="none" stroke="#b94c25" stroke-width="2.5" stroke-linejoin="round"/>
  <text x="60" y="46" font-family="Georgia, serif" font-size="30" font-weight="600" fill="#5a1121">Novastar</text>
  <text x="60" y="62" font-family="Arial, sans-serif" font-size="14" letter-spacing="0.08em" fill="#772836">MONTESSORI SCHOOL</text>
</svg>