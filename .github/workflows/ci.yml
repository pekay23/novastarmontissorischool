name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
  DATABASE_URL: ${{ secrets.DATABASE_URL }}
  NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
  NEXTAUTH_URL: http://localhost:3000
  # Migration deploy stays off until the Prisma migration history is baselined.
  # See the gated step in the build job.
  MIGRATE_ON_PUSH: ${{ vars.MIGRATE_ON_PUSH }}

jobs:
  lint-and-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Every job is a clean runner, so @prisma/client is never generated and
      # exports nothing. packages/database/index.ts imports PrismaClient, the
      # models and the enums, so typecheck and the app builds both fail with
      # TS2305 until the client is generated. --frozen-lockfile does not
      # generate it: that depends on @prisma/client's postinstall hook, which
      # does not fire reliably under bun's isolated node_modules layout.
      - name: Generate Prisma Client
        run: bun run --cwd packages/database db:generate

      - name: Run lint
        run: bun run lint

      - name: Run typecheck
        run: bun run typecheck

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Every job is a clean runner, so @prisma/client is never generated and
      # exports nothing. packages/database/index.ts imports PrismaClient, the
      # models and the enums, so typecheck and the app builds both fail with
      # TS2305 until the client is generated. --frozen-lockfile does not
      # generate it: that depends on @prisma/client's postinstall hook, which
      # does not fire reliably under bun's isolated node_modules layout.
      - name: Generate Prisma Client
        run: bun run --cwd packages/database db:generate

      - name: Run unit tests
        run: bun run test

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Every job is a clean runner, so @prisma/client is never generated and
      # exports nothing. packages/database/index.ts imports PrismaClient, the
      # models and the enums, so typecheck and the app builds both fail with
      # TS2305 until the client is generated. --frozen-lockfile does not
      # generate it: that depends on @prisma/client's postinstall hook, which
      # does not fire reliably under bun's isolated node_modules layout.
      - name: Generate Prisma Client
        run: bun run --cwd packages/database db:generate

      - name: Build all apps
        run: bun run build

      # The package is @novastar/database, not "database", so --filter=database
      # matched nothing and turbo exited 1 with "No package found with name
      # 'database' in workspace". Fixed, but the step is now GATED OFF.
      #
      # It must stay off until the migration history is baselined. Neon has no
      # _prisma_migrations table, because the live schema was built with
      # `prisma db push` rather than `migrate deploy`, and the checked-in init
      # migration is 56 bare CREATE TABLE / CREATE TYPE statements with no
      # IF NOT EXISTS. Against a database that already has all of them it will
      # fail partway through, leaving a partially applied migration recorded
      # against production on every push to main.
      #
      # To enable: baseline the live databases (mark the init migration as
      # applied with `prisma migrate resolve --applied`, or diff and reconcile
      # first), then set MIGRATE_ON_PUSH=true in the repository settings.
      - name: Deploy database migrations
        if: env.MIGRATE_ON_PUSH == 'true'
        run: bunx turbo run db:migrate:deploy --filter=@novastar/database
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

  test-e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [build]
    # A hung suite should burn minutes, not hours. playwright.config.ts sets
    # retries: 0 and a 20s per-test timeout, so the suite is designed to
    # finish quickly whether it passes or fails; this ceiling only catches the
    # case where the whole job wedges (a dev server that never comes up).
    timeout-minutes: 20
    env:
      # The signed-in specs need an account. Until E2E credentials are
      # provisioned as secrets they skip themselves rather than failing, so CI
      # is not red for a missing test account. See hasCredentials() in
      # e2e/fixtures.ts.
      E2E_EMAIL: ${{ vars.E2E_EMAIL }}
      E2E_PASSWORD: ${{ vars.E2E_PASSWORD }}
      E2E_SCHOOL_CODE: ${{ vars.E2E_SCHOOL_CODE }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Every job is a clean runner, so @prisma/client is never generated and
      # exports nothing. packages/database/index.ts imports PrismaClient, the
      # models and the enums, so typecheck and the app builds both fail with
      # TS2305 until the client is generated. --frozen-lockfile does not
      # generate it: that depends on @prisma/client's postinstall hook, which
      # does not fire reliably under bun's isolated node_modules layout.
      - name: Generate Prisma Client
        run: bun run --cwd packages/database db:generate

      # Playwright downloads browser binaries separately, matched to the
      # installed @playwright/test version. Without this the specs cannot
      # launch: "Executable doesn't exist at
      # /home/runner/.cache/ms-playwright/chromium_headless_shell-1243/...".
      # All three projects in playwright.config.ts are installed, not just
      # chromium, because the config runs firefox and webkit too.
      # --with-deps also installs the Linux system libraries they need.
      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium firefox webkit

      - name: Run E2E tests
        run: bun run test:e2e

# The Neon -> Supabase mirror moved to .github/workflows/db-mirror.yml.
# The job that used to live here passed NEON_DATABASE_URL while the tool reads
# DATABASE_URL, and invoked it as `bun run --filter=@novastar/db-mirror mirror`,
# which is not valid bun. It could not have worked if it had ever triggered.

# ============================================================================
# Container build
#
# Both Dockerfiles are validated here so a broken image is caught in CI rather
# than on a developer machine. The layer cache is pushed to GHCR with
# mode=max, which is what makes the second and later builds fast: the `deps`
# stage installs from package.json manifests only, so editing a .tsx file does
# not reinstall dependencies.
#
# Disabled until you opt in, because it needs the ghcr credentials:
#   repo variable DOCKER_BUILD_ENABLED = true
#   repo secrets   DOCKER_USERNAME     = <github actor>
#   repo secrets   DOCKER_PASSWORD     = <PAT with packages:write>
# ============================================================================
  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, test, build]
    if: github.ref == 'refs/heads/main' && vars.DOCKER_BUILD_ENABLED == 'true'

    permissions:
      contents: read
      packages: write

    env:
      REGISTRY: ghcr.io
      IMAGE_OWNER: ${{ github.repository_owner }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # Cache the bun + node-gyp work in the `deps` layer. The manifest COPYs
      # inside each Dockerfile mean this cache only invalidates when a
      # dependency actually changes.
      - name: Cache builder deps layer
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Build and push portal image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/novastar-portal:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/novastar-portal:${{ github.sha }}
          cache-from: type=gha,scope=portal
          cache-to: type=gha,mode=max,scope=portal
          build-args: |
            NEXTAUTH_SECRET=build-only-placeholder-not-a-real-secret
            NEXTAUTH_URL=https://portal.example.com

      - name: Build and push public-site image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.public-site
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/novastar-public-site:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/novastar-public-site:${{ github.sha }}
          cache-from: type=gha,scope=public-site
          cache-to: type=gha,mode=max,scope=public-site

# ============================================================================
# Vercel deploy
#
# Application secrets are NOT passed through GitHub. `vercel pull` fetches the
# project's own environment variables from Vercel, so DATABASE_URL,
# NEXTAUTH_SECRET, NEXT_PUBLIC_ORIGIN and the rest live in the Vercel project
# settings and never touch this file or the runner logs.
#
# The flow is pull -> build -> deploy --prebuilt so exactly one build runs and
# the artifact that is uploaded is the one this repo produced.
#
# Disabled until you opt in:
#   repo variable VERCEL_DEPLOY_ENABLED = true
#   repo secrets VERCEL_TOKEN, VERCEL_ORG_ID,
#                VERCEL_PROJECT_ID_PORTAL, VERCEL_PROJECT_ID_PUBLIC
# ============================================================================
  deploy:
    name: Deploy to Vercel
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, test, build, test-e2e]
    # Production deploys happen only from main, only after every gate passed,
    # and only when explicitly enabled.
    if: github.ref == 'refs/heads/main' && vars.VERCEL_DEPLOY_ENABLED == 'true'

    environment:
      name: production

    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID_PORTAL: ${{ secrets.VERCEL_PROJECT_ID_PORTAL }}
      VERCEL_PROJECT_ID_PUBLIC: ${{ secrets.VERCEL_PROJECT_ID_PUBLIC }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: 1.4.0

      # Same cache path the Docker build uses, so the two runners do not
      # duplicate download work across separate caches.
      - name: Cache bun download cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma Client
        run: bun run --cwd packages/database db:generate

      # The portal is a Next.js standalone build; Vercel runs `next build`
      # itself, so all this step needs to do is make the workspace importable.
      - name: Deploy portal
        id: portal
        working-directory: apps/portal
        run: |
          npx --yes vercel@latest pull --yes --environment=production --token="$VERCEL_TOKEN"
          npx --yes vercel@latest build --prod --token="$VERCEL_TOKEN"
          npx --yes vercel@latest deploy --prebuilt --prod --yes --token="$VERCEL_TOKEN"

      - name: Deploy public site
        id: public
        working-directory: apps/public-site
        run: |
          npx --yes vercel@latest pull --yes --environment=production --token="$VERCEL_TOKEN"
          npx --yes vercel@latest build --prod --token="$VERCEL_TOKEN"
          npx --yes vercel@latest deploy --prebuilt --prod --yes --token="$VERCEL_TOKEN"

      - name: Summary
        run: |
          echo "### Vercel deploy" >> "$GITHUB_STEP_SUMMARY"
          echo "- portal: ${{ steps.portal.outputs.deployment-url }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- public-site: ${{ steps.public.outputs.deployment-url }}" >> "$GITHUB_STEP_SUMMARY"
