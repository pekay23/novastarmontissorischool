name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
  DATABASE_URL: ${{ secrets.DATABASE_URL }}
  # The repository has no NEXTAUTH_SECRET configured, so this renders as an
  # EMPTY string unless a fallback is given -- and an empty value is worse than
  # an absent one: next-auth answers every session check with
  # `error=Configuration`, and the app's AES-256-GCM layer refuses to derive a
  # key at all, which 500s the TOTP enrolment route. CI only ever needs a
  # working value, never the production one: it runs tests, not real sessions.
  # Setting the repository secret overrides this; production takes its value
  # from the Vercel project's own environment (the deploy job pulls it).
  NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET || 'ci-only-not-a-real-secret' }}
  NEXTAUTH_URL: http://localhost:3000
  # Migration deploy stays off until the Prisma migration history is baselined.
  # See the gated step in the build job.
  MIGRATE_ON_PUSH: ${{ vars.MIGRATE_ON_PUSH }}

# ============================================================================
# Jobs
#
# Three runner conventions, each deliberate:
#
#   runs-on: ubuntu-24.04 -- pinned, not `ubuntu-latest`. GitHub migrates
#     `ubuntu-latest` to Ubuntu 26 on 2026-10-19, which would change the
#     toolchain under a pipeline nobody touched. Pin it and move it on purpose.
#
#   actions/checkout@v7 and oven-sh/setup-bun@v2 -- the v4/v1 versions target
#     Node.js 20, which GitHub deprecates on 2025-09-19 and now forces onto
#     Node 24 with a per-job warning. Newer majors target the supported runtime.
#
#   actions/cache is used only by the two opt-in jobs (docker, deploy). The
#     "Failed to save/restore: Cache service responded with 400" warnings come
#     from GitHub's cache service during its own outages and are attached to
#     every check run in the workflow, not to these jobs' steps.
# ============================================================================
jobs:
  lint-and-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Every job is a clean runner, so @prisma/client is never generated and
      # exports nothing. packages/database/index.ts imports PrismaClient, the
      # models and the enums, so typecheck and the app builds both fail with
      # TS2305 until the client is generated. --frozen-lockfile does not
      # generate it: that depends on @prisma/client's postinstall hook, which
      # does not fire reliably under bun's isolated node_modules layout.
      - name: Generate Prisma Client
        run: bun run --cwd packages/database db:generate

      # The pre-commit hook is bypassable (`--no-verify`) and local-only, so the
      # scanner runs here too: a live-looking secret in a tracked file fails the
      # build rather than reaching the registry.
      - name: Scan for secrets
        run: node tools/scan-secrets.mjs

      - name: Run lint
        run: bun run lint

      - name: Run typecheck
        run: bun run typecheck

  test:
    name: Tests
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Every job is a clean runner, so @prisma/client is never generated and
      # exports nothing. packages/database/index.ts imports PrismaClient, the
      # models and the enums, so typecheck and the app builds both fail with
      # TS2305 until the client is generated. --frozen-lockfile does not
      # generate it: that depends on @prisma/client's postinstall hook, which
      # does not fire reliably under bun's isolated node_modules layout.
      - name: Generate Prisma Client
        run: bun run --cwd packages/database db:generate

      - name: Run unit tests
        run: bun run test

  build:
    name: Build
    runs-on: ubuntu-24.04
    needs: [lint-and-typecheck]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Every job is a clean runner, so @prisma/client is never generated and
      # exports nothing. packages/database/index.ts imports PrismaClient, the
      # models and the enums, so typecheck and the app builds both fail with
      # TS2305 until the client is generated. --frozen-lockfile does not
      # generate it: that depends on @prisma/client's postinstall hook, which
      # does not fire reliably under bun's isolated node_modules layout.
      - name: Generate Prisma Client
        run: bun run --cwd packages/database db:generate

      - name: Build all apps
        run: bun run build

      # GATED OFF, and it stays off until a person resolves it. Two independent
      # reasons, either of which alone is disqualifying:
      #
      # 1. The migration history is not baselined. Neon has no
      #    _prisma_migrations table, because the live schema was built with
      #    `prisma db push` rather than `migrate deploy`, and the checked-in init
      #    migration is 56 bare CREATE TABLE / CREATE TYPE statements with no
      #    IF NOT EXISTS. Against a database that already has all of them it
      #    fails partway through, leaving a partially applied migration recorded
      #    against production on every push to main.
      #
      # 2. This step deliberately does NOT pass `--yes`. With no TTY and no
      #    --yes, the guarded tool treats the confirmation as a refusal and
      #    exits 1 (tools/migrate/README.md, "Safety properties"). That is the
      #    intended failure mode: turning this step on must never quietly begin
      #    applying migrations to production. `--yes --allow-production` is an
      #    owner decision taken at the same time as baselining, not a CI default.
      #
      # The filter below was wrong until 2026-10-03: it named
      # @novastar/database, which has no `db:migrate:deploy` script, so turbo
      # resolved ZERO tasks and the step could not have done anything even with
      # the gate open. @novastar/migrate owns it, and it is what the root
      # `db:migrate:deploy` script resolves to (package.json) -- the guarded
      # wrapper, never a raw `prisma migrate deploy`. `prisma migrate dev` is
      # deliberately not wired into any CI path: it can offer to reset a live
      # database.
      #
      # To enable, in this order (tools/migrate/README.md has the full contract):
      #   a. Prove the files compose, against a throwaway Neon branch:
      #      bun run db:migrate:compose -- --shadow-database-url <branch-url>
      #   b. Preview the ledger write, then write it. `baseline` is declared in
      #      turbo.json as task `baseline` and is a dry run unless --apply, and
      #      it refuses an invocation that has not said what it is asserting
      #      (--migration <name>, or --assert-all):
      #      bunx turbo run baseline --filter=@novastar/migrate -- --migration <name>
      #      bunx turbo run baseline --filter=@novastar/migrate -- --apply --migration <name> --yes
      #      It also needs --allow-production and a backup attestation, and it
      #      writes ledger rows claiming history - there is no honest undo.
      #   c. Set MIGRATE_ON_PUSH=true in the repository settings, and decide
      #      whether this step should then pass --yes.
      - name: Deploy database migrations
        if: env.MIGRATE_ON_PUSH == 'true'
        run: bunx turbo run db:migrate:deploy --filter=@novastar/migrate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

  test-e2e:
    name: E2E Tests
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --ipc=host
    needs: [build]
    # A hung suite should burn minutes, not hours. playwright.config.ts sets
    # retries: 0 and a 20s per-test timeout, so the suite is designed to
    # finish quickly whether it passes or fails; this ceiling only catches the
    # case where the whole job wedges (a dev server that never comes up).
    timeout-minutes: 20
    env:
      # The signed-in specs need an account. Until E2E credentials are
      # provisioned as secrets they skip themselves rather than failing, so CI
      # is not red for a missing test account. See hasCredentials() in
      # e2e/fixtures.ts.
      E2E_EMAIL: ${{ vars.E2E_EMAIL }}
      E2E_PASSWORD: ${{ vars.E2E_PASSWORD }}
      E2E_SCHOOL_CODE: ${{ vars.E2E_SCHOOL_CODE }}
      # Let the admin login render its enabled form in E2E. This is only a
      # disposable signing key for the test server; it cannot authenticate to
      # the production console.
      PLATFORM_SESSION_SECRET: ci-only-admin-session-placeholder-not-for-production
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      # The suite serves the app on the pinned e2e port (3100 — the default in
      # scripts/ci/e2e.ts and playwright.config.ts); the global env's
      # http://localhost:3000 is the dev server's port. Next-auth takes its
      # origin and its API mount point from this value, so pointing it at the
      # suite's own port and auth path keeps the client-side calls same-origin.
      # NEXTAUTH_SECRET is inherited from the job-level fallback above.
      NEXTAUTH_URL: http://localhost:3100/portal/api/auth
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Bun download utility
        run: apt-get update -qq && apt-get install --no-install-recommends -y unzip

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Every job is a clean runner, so @prisma/client is never generated and
      # exports nothing. packages/database/index.ts imports PrismaClient, the
      # models and the enums, so typecheck and the app builds both fail with
      # TS2305 until the client is generated. --frozen-lockfile does not
      # generate it: that depends on @prisma/client's postinstall hook, which
      # does not fire reliably under bun's isolated node_modules layout.
      - name: Generate Prisma Client
        run: bun run --cwd packages/database db:generate

      - name: Run E2E tests
        run: bun run test:e2e
        env:
          HOME: /root

# The Neon -> Supabase mirror moved to .github/workflows/db-mirror.yml.
# The job that used to live here passed NEON_DATABASE_URL while the tool reads
# DATABASE_URL, and invoked it as `bun run --filter=@novastar/db-mirror mirror`,
# which is not valid bun. It could not have worked if it had ever triggered.

# ============================================================================
# Container build
#
# One image, one app: ADR-024 merged the portal, the admin console and the
# public site into `apps/web`, so `Dockerfile.web` is the only image this repo
# builds. It is validated here so a broken image is caught in CI rather than on
# a developer machine. The layer cache is pushed to GHCR with mode=max, which
# is what makes the second and later builds fast: the `deps` stage installs
# from package.json manifests only, so editing a .tsx file does not reinstall
# dependencies.
#
# Disabled until you opt in, because it needs the ghcr credentials:
#   repo variable DOCKER_BUILD_ENABLED = true
#   repo secrets   DOCKER_USERNAME     = <github actor>
#   repo secrets   DOCKER_PASSWORD     = <PAT with packages:write>
# ============================================================================
  docker:
    name: Docker Build
    runs-on: ubuntu-24.04
    needs: [lint-and-typecheck, test, build]
    if: github.ref == 'refs/heads/main' && vars.DOCKER_BUILD_ENABLED == 'true'

    permissions:
      contents: read
      packages: write

    env:
      REGISTRY: ghcr.io
      IMAGE_OWNER: ${{ github.repository_owner }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # Cache the bun + node-gyp work in the `deps` layer. The manifest COPYs
      # inside each Dockerfile mean this cache only invalidates when a
      # dependency actually changes.
      - name: Cache builder deps layer
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      # One image, one app: ADR-024 merged the portal, the admin console and the
      # public site into `apps/web`, and the legacy apps' Dockerfiles were
      # deleted with them. `Dockerfile.web` is the only image this repo builds.
      - name: Build and push web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.web
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/novastar-web:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/novastar-web:${{ github.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
          build-args: |
            NEXTAUTH_SECRET=build-only-placeholder-not-a-real-secret
            NEXTAUTH_URL=https://portal.example.com

# ============================================================================
# Vercel deploy
#
# Application secrets are NOT passed through GitHub. `vercel pull` fetches the
# project's own environment variables from Vercel, so DATABASE_URL,
# NEXTAUTH_SECRET, NEXT_PUBLIC_ORIGIN and the rest live in the Vercel project
# settings and never touch this file or the runner logs.
#
# The flow is pull -> build -> deploy --prebuilt so exactly one build runs and
# the artifact that is uploaded is the one this repo produced.
#
# Disabled until you opt in:
#   repo variable VERCEL_DEPLOY_ENABLED = true
#   repo secrets VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID_WEB
# ============================================================================
  deploy:
    name: Deploy to Vercel
    runs-on: ubuntu-24.04
    needs: [lint-and-typecheck, test, build, test-e2e]
    # Production deploys happen only from main, only after every gate passed,
    # and only when explicitly enabled.
    if: github.ref == 'refs/heads/main' && vars.VERCEL_DEPLOY_ENABLED == 'true'

    environment:
      name: production

    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID_WEB: ${{ secrets.VERCEL_PROJECT_ID_WEB }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      # Same cache path the Docker build uses, so the two runners do not
      # duplicate download work across separate caches.
      - name: Cache bun download cache
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma Client
        run: bun run --cwd packages/database db:generate

      # Single merged web app deploy
      # From the repo root, NOT `working-directory: apps/web`. The project's
      # Root Directory is `apps/web`, and the CLI resolves that against the
      # working directory: run from `apps/web` and it looks for
      # `apps/web/apps/web` and fails. From the root, the CLI cds into the root
      # directory itself for the build command (which is why vercel.json's
      # `cd ../..` is right) and finds the prebuilt output in `.vercel/output`.
      - name: Deploy web app
        id: web
        env:
          # The Vercel CLI reads the literal names VERCEL_PROJECT_ID and
          # VERCEL_ORG_ID. The secrets keep the workflow's `_WEB` suffix from
          # the three-project era, so map it here — without it the CLI refuses
          # with "You specified VERCEL_ORG_ID but you forgot to specify
          # VERCEL_PROJECT_ID".
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_WEB }}
        run: |
          npx --yes vercel@59.15.1 pull --yes --environment=production --token="$VERCEL_TOKEN"
          npx --yes vercel@59.15.1 build --prod --token="$VERCEL_TOKEN"
          npx --yes vercel@59.15.1 deploy --prebuilt --prod --yes --token="$VERCEL_TOKEN"

      - name: Summary
        run: |
          echo "### Vercel deploy" >> "$GITHUB_STEP_SUMMARY"
          echo "- web: ${{ steps.web.outputs.deployment-url }}" >> "$GITHUB_STEP_SUMMARY"
